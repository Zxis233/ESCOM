[workspace]
members = [".", "crates/escom-core", "crates/escom-tui"]
default-members = ["."]
resolver = "3"

[package]
name = "escom"
version = "0.3.1"
edition = "2024"
build = "build.rs"
description = "A practical Windows serial-port viewer"
license = "MIT"

[dependencies]
escom-core = { path = "crates/escom-core" }
chrono = { version = "0.4.41", features = ["clock", "serde"] }
crossbeam-channel = "0.5.15"
directories = "6.0.0"
eframe = { version = "0.35.0", features = ["persistence"] }
egui_extras = { version = "0.35.0", features = ["file", "http", "image"] }
fontdb = "0.23.0"
image = { version = "0.25.10", default-features = false, features = ["bmp", "gif", "jpeg", "png", "tiff", "webp"] }
log = "0.4.33"
regex = "1.12.2"
rfd = "0.17.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
serialport = "4.9.0"
tempfile = "3.27.0"
toml = "1.1.4"

[build-dependencies]
winresource = "0.1.31"

[dev-dependencies]
criterion = "0.8.2"

[[bench]]
name = "pipeline"
harness = false

[package.metadata.winresource]
FileDescription = "ESCOM 串口查看器"
ProductName = "ESCOM"
OriginalFilename = "escom.exe"
LegalCopyright = "Copyright (c) 2026 ESCOM contributors"

[profile.release]
lto = "fat"
strip = "symbols"
