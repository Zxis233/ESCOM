name: Build and publish Windows executable

run-name: ${{ inputs.release_type }} from ${{ github.ref_name }}

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: Publish type
        required: true
        default: PreRelease
        type: choice
        options:
          - Release
          - PreRelease

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build and publish
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      RUST_TOOLCHAIN: 1.96.0
      TARGET: x86_64-pc-windows-msvc
      CARGO_TARGET_X86_64_PC_WINDOWS_MSVC_RUSTFLAGS: -C target-feature=+crt-static

    steps:
      - name: Check out repository and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        shell: pwsh
        run: |
          rustup toolchain install $env:RUST_TOOLCHAIN --profile minimal
          rustup target add $env:TARGET --toolchain $env:RUST_TOOLCHAIN
          rustup default $env:RUST_TOOLCHAIN
          rustc --version
          cargo --version

      - name: Determine release version
        id: version
        shell: pwsh
        run: |
          $tags = @(git tag --points-at $env:GITHUB_SHA --sort=-version:refname)
          if ($LASTEXITCODE -ne 0) {
            throw "Unable to inspect tags for $env:GITHUB_SHA"
          }

          if ($tags.Count -gt 0) {
            $version = $tags[0].Trim()
            $source = "tag"
          } else {
            $version = (git rev-parse --short=7 $env:GITHUB_SHA).Trim()
            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($version)) {
              throw "Unable to determine the short commit hash"
            }
            $source = "commit"
          }

          $assetVersion = $version -replace '[^0-9A-Za-z._-]', '-'
          if ([string]::IsNullOrWhiteSpace($assetVersion)) {
            throw "The version cannot be converted to a valid asset name"
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "tag=$version" >> $env:GITHUB_OUTPUT
          "asset_version=$assetVersion" >> $env:GITHUB_OUTPUT
          "source=$source" >> $env:GITHUB_OUTPUT

          "Resolved version '$version' from $source."

      - name: Verify source
        shell: pwsh
        run: cargo test --all-targets --locked --target $env:TARGET

      - name: Build release executable
        shell: pwsh
        run: cargo build --release --locked --target $env:TARGET

      - name: Prepare release asset
        id: asset
        shell: pwsh
        run: |
          $source = "target\$env:TARGET\release\escom.exe"
          if (-not (Test-Path -LiteralPath $source -PathType Leaf)) {
            throw "Built executable was not found at $source"
          }

          New-Item -ItemType Directory -Path dist -Force | Out-Null
          $assetName = "ESCOM-${{ steps.version.outputs.asset_version }}-windows-x86_64.exe"
          $assetPath = Join-Path dist $assetName
          Copy-Item -LiteralPath $source -Destination $assetPath -Force

          "path=$assetPath" >> $env:GITHUB_OUTPUT
          "name=$assetName" >> $env:GITHUB_OUTPUT

      - name: Ensure release does not already exist
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release view $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            throw "Release '$env:RELEASE_TAG' already exists. Delete it or use another tag/commit before rerunning."
          }

          exit 0

      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_ASSET: ${{ steps.asset.outputs.path }}
          RELEASE_TYPE: ${{ inputs.release_type }}
        run: |
          $arguments = @(
            "release", "create", $env:RELEASE_TAG, $env:RELEASE_ASSET,
            "--repo", $env:GITHUB_REPOSITORY,
            "--target", $env:GITHUB_SHA,
            "--title", "ESCOM $env:RELEASE_VERSION",
            "--generate-notes"
          )

          if ($env:RELEASE_TYPE -eq "PreRelease") {
            $arguments += "--prerelease"
            $arguments += "--latest=false"
          } else {
            $arguments += "--latest"
          }

          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub Release creation failed"
          }

      - name: Write workflow summary
        shell: pwsh
        run: |
          @"
          ## ESCOM Windows publication

          | Item | Value |
          | --- | --- |
          | Type | `${{ inputs.release_type }}` |
          | Version | `${{ steps.version.outputs.version }}` |
          | Version source | `${{ steps.version.outputs.source }}` |
          | Asset | `${{ steps.asset.outputs.name }}` |
          | Commit | `${{ github.sha }}` |
          "@ >> $env:GITHUB_STEP_SUMMARY
