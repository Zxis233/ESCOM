# Default: GUI data folder / ESCOM / tui.toml. Created automatically on first TUI run.
# --config <file> selects a different file to load AND save. CLI overrides TOML.
# Preferences are saved after 750 ms and on exit; saved ports require F3 or --connect.
language = "en" # en or zh-CN; independent of serial encoding
port = ""
baud = 115200
data_bits = 8
stop_bits = 1
parity = "none"
flow = "none"
dtr = false
rts = false
mode = "text"
encoding = "utf8"
line_ending = "crlf"
send_mode = "text"
timestamps = true

history_kib = 2048
history_records = 8192
display_kib = 512
display_rows = 2000
line_kib = 8
tx_kib = 256
send_kib = 64
record_queue_kib = 256

# Optional one-shot inputs: accepted on load, omitted when saving.
# Raw RX capture is create-new only. Paths are relative to working directory.
# record = "session.bin"
demo = false
