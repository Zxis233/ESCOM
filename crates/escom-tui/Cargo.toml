[package]
name = "escom-tui"
version = "0.3.1"
edition = "2024"
license = "MIT"
description = "A bounded-memory terminal serial-port viewer"

[dependencies]
escom-core = { path = "../escom-core" }
chrono = { version = "0.4.41", features = ["clock"] }
crossterm = "0.29.0"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
serde = { version = "1.0.219", features = ["derive"] }
serialport = "4.9.0"
toml = "1.1.4"
unicode-width = "0.2.2"

tempfile = "3.27.0"
